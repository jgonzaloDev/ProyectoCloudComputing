name: 'CI/CD - Albergue ASP.NET'

on:
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Build y Compilar
  # ==========================================
  build:
    name: 'Build y Compilar'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Albergue_aspnet_DAS.csproj

      - name: Compilar proyecto
        run: dotnet build Albergue_aspnet_DAS.csproj --configuration Release --no-restore

      - name: Publicar proyecto
        run: dotnet publish Albergue_aspnet_DAS.csproj --configuration Release --output ./publish

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./publish

  # ==========================================
  # Job 2: Migraciones de Base de Datos
  # ==========================================
  migrate:
    name: 'Aplicar migraciones (update-database)'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar herramienta EF Core
        run: dotnet tool install --global dotnet-ef

      - name: Aplicar migraciones
        run: dotnet ef database update --project Albergue_aspnet_DAS.csproj

  # ==========================================
  # Job 3: Deploy al App Service
  # ==========================================
  deploy:
    name: 'Deploy a Azure App Service'
    runs-on: ubuntu-latest
    needs: [build, migrate]

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: ./publish

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy al App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'amorRescate'
          package: ./publish